<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo">

        <h1>تسجيل الدخول</h1>

        <p class="welcome">

            الرجاء إدخال بيانات الدخول للمتابعة إلى الاختبار

        </p>

    </div>

    <div class="exam-card">

        <input
            type="text"
            id="username"
            placeholder="اسم المستخدم"
            class="login-input"
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            class="login-input"
        >

        <br><br>

        <button
            class="start-btn"
            onclick="login()"
        >
            تسجيل الدخول
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
