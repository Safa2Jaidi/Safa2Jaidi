<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>من الصفر إلى النشر</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=5.0">

<style>
    .demo-info{
margin-top:12px;
margin-bottom:18px;
text-align:center;
line-height:1.9;
color:#666;
font-size:18px;
}

.login-btn,
.results-btn{
width:100%;
height:70px;
border:none;
border-radius:14px;
font-size:20px;
font-weight:700;
cursor:pointer;
}

.login-btn{
margin-bottom:18px;
}

.section-divider{
width:100%;
height:1px;
background:rgba(0,0,0,.08);
margin:10px 0 18px;
}

.login-card{
max-width:500px;
margin:30px auto;
background:#ffffff;
padding:30px;
border-radius:20px;
box-shadow:0 4px 20px rgba(0,0,0,.12);
text-align:center;
}

.login-card h2{
margin-bottom:25px;
color:#1e3a8a;
}

.form-group{
margin-bottom:15px;
}

.form-group input{
width:100%;
padding:14px;
font-size:16px;
font-family:'Cairo',sans-serif;
border:1px solid #d1d5db;
border-radius:10px;
box-sizing:border-box;
}

.form-group input:focus{
outline:none;
border-color:#2563eb;
}

.login-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
font-family:'Cairo',sans-serif;
cursor:pointer;
}

.login-btn:hover{
background:#1d4ed8;
}

.error{
margin-top:15px;
color:#dc2626;
font-weight:bold;
}

.info-box{
margin-top:15px;
font-size:14px;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img
src="logo.png"
alt="شعار المدرسة"
class="logo">

<h1>من الصفر إلى النشر</h1>

<p>

سلسلة تدريبية على

<a
href="https://www.facebook.com/share/p/1EWCNLxLcB/"
target="_blank"
class="school-link">

صفحة المدرسة الشرعية

</a>

</p>

</div>

<div class="login-card">



```
<h2 class="login-title">تسجيل الدخول</h2>

<div class="form-group">

<input
type="text"
id="username"
class="login-input"
placeholder="اسم المستخدم"
value="stud">

<input
type="password"
id="password"
class="login-input"
placeholder="كلمة المرور"
value="stud@2026">

</div>

<div class="demo-info">
للتجربة الحالية:
<br>
اسم المستخدم: stud
<br>
كلمة المرور: stud@2026
</div>

<button class="login-btn" onclick="login()">
دخول
</button>

<div class="section-divider"></div>

<button
class="results-btn"
onclick="window.location.href='admin.html'">
لوحة النتائج
</button>

<div id="error" class="error"></div>

</div>

<footer class="footer">

© مدرسة إناث قلقيلية الشرعية

<br>

وزارة الأوقاف والشؤون الدينية الفلسطينية

</footer>

<script>

async function login() {

const username =
document
.getElementById("username")
.value
.trim();

const password =
document
.getElementById("password")
.value
.trim();

document
.getElementById("error")
.innerText = "";

try {

const response =
await fetch(
"/api/auth/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
}
);

const data =
await response.json();

if(data.success){

localStorage.setItem(
"currentUser",
JSON.stringify(data.user)
);

window.location.href =
"exam.html";

}else{

document
.getElementById("error")
.innerText =
"بيانات الدخول غير صحيحة";

}

}catch(error){

console.error(error);

document
.getElementById("error")
.innerText =
"تعذر الاتصال بالخادم";

}

}

</script>

</body>

</html>
